            - paragraph [ref=f1e275]: "Additional environment assumptions:"
            - list [ref=f1e276]:
              - listitem [ref=f1e277]:
                - code [ref=f1e278]: winget
                - text: should be available. If it’s missing, update Windows or install the Windows Package Manager before setting up Codex.
              - listitem [ref=f1e279]: The recommended native sandbox depends on administrator-approved setup.
              - listitem [ref=f1e280]: Some enterprise-managed devices block the required setup steps even when the OS version itself is acceptable.
            - heading "Grant sandbox read access Copy link to grant sandbox read access" [level=3] [ref=f1e281]:
              - generic [ref=f1e282]: Grant sandbox read access
              - button "Copy link to grant sandbox read access" [ref=f1e283] [cursor=pointer]
            - paragraph [ref=f1e286]: "When a command fails because the Windows sandbox can’t read a directory, use:"
            - generic [ref=f1e287]:
              - code [ref=f1e288]:
                - generic [ref=f1e289]: /sandbox-add-read-dir C:\absolute\directory\path
              - generic [ref=f1e290]:
                - button "Copy code to clipboard" [ref=f1e291] [cursor=pointer]
                - status [ref=f1e294]
            - paragraph [ref=f1e295]: The path must be an existing absolute directory. After the command succeeds, later commands that run in the sandbox can read that directory during the current session.
            - paragraph [ref=f1e296]:
              - text: Use the native Windows sandbox by default. Choose
              - link "WSL" [ref=f1e297] [cursor=pointer]:
                - /url: /docs/windows/wsl
              - text: when you need Linux-native tooling, your workflow already lives in WSL2, or neither native Windows sandbox mode meets your needs.
            - heading "Troubleshooting and FAQ Copy link to troubleshooting and faq" [level=2] [ref=f1e298]:
              - generic [ref=f1e299]: Troubleshooting and FAQ
              - button "Copy link to troubleshooting and faq" [ref=f1e300] [cursor=pointer]
            - paragraph [ref=f1e303]: If you are troubleshooting a managed Windows machine, start with the native sandbox mode, Windows version, and any policy error shown by Codex. Most native Windows support issues come from sandbox setup, logon rights, or filesystem permissions rather than from the editor itself.
