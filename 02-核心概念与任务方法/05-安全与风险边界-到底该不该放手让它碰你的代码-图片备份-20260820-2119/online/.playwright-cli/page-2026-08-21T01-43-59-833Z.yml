                  - cell "Best effort" [ref=f1e269]
                  - cell "Can work, but is less reliable than Windows 11. For Windows 10, Codex depends on modern console support, including ConPTY. In practice, Windows 10 version 1809 or newer is required." [ref=f1e270]
                - row [ref=f1e271]:
