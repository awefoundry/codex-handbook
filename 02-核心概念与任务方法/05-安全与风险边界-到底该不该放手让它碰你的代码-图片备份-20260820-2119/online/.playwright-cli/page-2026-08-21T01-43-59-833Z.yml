            - heading "Windows sandbox" [level=1] [ref=f1e157]
            - paragraph [ref=f1e158]: Configure and troubleshoot the native Codex sandbox on Windows
          - article [ref=f1e159]:
            - paragraph [ref=f1e160]:
              - text: Use Codex on Windows with the native
              - link "ChatGPT desktop app" [ref=f1e161] [cursor=pointer]:
                - /url: /docs/windows/windows-app
              - text: ", the"
              - link "CLI" [ref=f1e162] [cursor=pointer]:
                - /url: /docs/codex/cli
              - text: ", or the"
              - link "IDE extension" [ref=f1e163] [cursor=pointer]:
                - /url: /docs/codex/ide
              - text: .
            - paragraph [ref=f1e164]: The ChatGPT desktop app on Windows supports core workflows such as parallel chats, worktrees, scheduled tasks, Git functionality, the built-in browser, file previews, plugins, and skills.
            - paragraph [ref=f1e165]: The app can run natively in PowerShell with a Windows sandbox instead of requiring WSL or a virtual machine. This keeps Codex in Windows-native workflows while enforcing bounded filesystem and network permissions.
            - button "Open ChatGPT desktop app Windows sandbox setup prompt above the message composer" [ref=f1e167]:
              - img "ChatGPT desktop app Windows sandbox setup prompt above the message composer" [ref=f1e168]
            - link "Use the ChatGPT desktop app on Windows Work across projects, run parallel chats, and review results in one place with the native Windows app." [ref=f1e171] [cursor=pointer]:
              - /url: /docs/windows/windows-app
              - generic [ref=f1e175]:
                - generic [ref=f1e176]: Use the ChatGPT desktop app on Windows
                - generic [ref=f1e177]: Work across projects, run parallel chats, and review results in one place with the native Windows app.
            - paragraph [ref=f1e181]: "The native Windows sandbox has two modes:"
            - list [ref=f1e182]:
              - listitem [ref=f1e183]:
                - text: natively on Windows with the stronger
                - code [ref=f1e184]: elevated
                - text: sandbox,
              - listitem [ref=f1e185]:
                - text: natively on Windows with the fallback
                - code [ref=f1e186]: unelevated
                - text: sandbox.
            - heading "Configure the Windows sandbox Copy link to configure the windows sandbox" [level=2] [ref=f1e187]:
              - generic [ref=f1e188]: Configure the Windows sandbox
              - button "Copy link to configure the windows sandbox" [ref=f1e189] [cursor=pointer]
            - paragraph [ref=f1e192]: When you run Codex natively on Windows, agent mode uses a Windows sandbox to block filesystem writes outside the working folder and prevent network access without your explicit approval.
            - paragraph [ref=f1e193]:
              - text: Native Windows sandbox support includes two modes that you can configure in
              - code [ref=f1e194]: config.toml
              - text: ":"
            - generic [ref=f1e195]:
              - code [ref=f1e196]:
                - generic [ref=f1e197]: "[windows]"
                - generic [ref=f1e198]: "sandbox = \"elevated\" # or \"unelevated\""
              - generic [ref=f1e199]:
                - button "Copy code to clipboard" [ref=f1e200] [cursor=pointer]
                - status [ref=f1e203]
            - paragraph [ref=f1e204]:
              - code [ref=f1e205]: elevated
              - text: is the preferred native Windows sandbox. It uses dedicated lower-privilege sandbox users, filesystem permission boundaries, firewall rules, and local policy changes needed for commands that run in the sandbox.
            - paragraph [ref=f1e206]:
              - code [ref=f1e207]: unelevated
              - text: is the fallback native Windows sandbox. It runs commands with a restricted Windows token derived from your current user, applies ACL-based filesystem boundaries, and uses environment-level offline controls instead of the dedicated offline-user firewall rule. It’s weaker than
              - code [ref=f1e208]: elevated
              - text: ", but it is still useful when administrator-approved setup is blocked by local or enterprise policy."
            - paragraph [ref=f1e209]:
              - text: If both modes are available, use
              - code [ref=f1e210]: elevated
              - text: . If the default native sandbox doesn’t work in your environment, use
              - code [ref=f1e211]: unelevated
              - text: as a fallback while you troubleshoot the setup.
            - paragraph [ref=f1e212]:
              - text: Enterprise administrators can constrain which native sandbox implementations Codex can use through
              - link [ref=f1e213] [cursor=pointer]:
                - /url: /docs/enterprise/managed-configuration#admin-enforced-requirements-requirementstoml
                - code [ref=f1e214]: requirements.toml
              - text: ":"
            - generic [ref=f1e215]:
              - code [ref=f1e216]:
                - generic [ref=f1e217]: "[windows]"
                - generic [ref=f1e218]: allowed_sandbox_implementations = ["elevated"]
              - generic [ref=f1e219]:
                - button "Copy code to clipboard" [ref=f1e220] [cursor=pointer]
                - status [ref=f1e223]
            - paragraph [ref=f1e224]:
              - text: This example requires the
              - code [ref=f1e225]: elevated
              - text: sandbox and prevents users from falling back to
              - code [ref=f1e226]: unelevated
              - text: . To permit either implementation, include both values; Codex prefers
              - code [ref=f1e227]: elevated
              - text: when no mode is selected. See the
              - link [ref=f1e228] [cursor=pointer]:
                - /url: /docs/config-file/config-reference#requirementstoml
                - code [ref=f1e229]: requirements.toml
                - text: reference
              - text: for the supported values.
            - paragraph [ref=f1e230]:
              - text: By default, both sandbox modes also use a private desktop for stronger UI isolation. Set
              - code [ref=f1e231]: windows.sandbox_private_desktop = false
              - text: only if you need the older
              - code [ref=f1e232]: Winsta0\\Default
              - text: behavior for compatibility.
            - heading "Sandbox permissions Copy link to sandbox permissions" [level=3] [ref=f1e233]:
              - generic [ref=f1e234]: Sandbox permissions
              - button "Copy link to sandbox permissions" [ref=f1e235] [cursor=pointer]
            - paragraph [ref=f1e246]:
              - text: Running Codex in full access mode means Codex is not limited to your project directory and might perform unintentional destructive actions that can lead to data loss. For safer automation, keep sandbox boundaries in place and use
              - link "rules" [ref=f1e247] [cursor=pointer]:
                - /url: /docs/agent-configuration/rules
              - text: for specific exceptions, or set your
              - link "approval policy to never" [ref=f1e248] [cursor=pointer]:
                - /url: /docs/agent-approvals-security#run-without-approval-prompts
              - text: to have Codex attempt to solve problems without asking for escalated permissions, based on your
              - link "approval and security setup" [ref=f1e249] [cursor=pointer]:
                - /url: /docs/agent-approvals-security
              - text: .
            - heading "Windows version matrix Copy link to windows version matrix" [level=3] [ref=f1e250]:
              - generic [ref=f1e251]: Windows version matrix
              - button "Copy link to windows version matrix" [ref=f1e252] [cursor=pointer]
