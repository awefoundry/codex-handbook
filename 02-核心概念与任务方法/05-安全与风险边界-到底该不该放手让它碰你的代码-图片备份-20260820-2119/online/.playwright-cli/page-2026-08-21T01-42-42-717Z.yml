            - heading "Sandbox" [level=1] [ref=e157]
            - paragraph [ref=e158]: How sandboxing works across ChatGPT and Codex clients
          - article [ref=e159]:
            - generic [ref=e160]:
              - paragraph [ref=e161]:
                - text: The sandbox is the boundary that lets the agent act autonomously without giving it unrestricted access to your machine. When a local chat runs commands in the
                - strong [ref=e162]: ChatGPT desktop app
                - text: ","
                - strong [ref=e163]: Codex CLI
                - text: ", or"
                - strong [ref=e164]: IDE extension
                - text: ", those commands run inside a constrained environment instead of running with full access by default."
              - paragraph [ref=e165]: That environment defines what the agent can do on its own, such as which files it can modify and whether commands can use the network. When a task stays inside those boundaries, the agent can keep moving without stopping for confirmation. When it needs to go beyond them, the approval flow takes over.
              - paragraph [ref=e174]: Sandboxing and approvals are different controls that work together. The sandbox defines technical boundaries. The approval policy decides when the agent must stop and ask before crossing them.
              - heading "What the sandbox does Copy link to what the sandbox does" [level=2] [ref=e175]:
                - generic [ref=e176]: What the sandbox does
                - button "Copy link to what the sandbox does" [ref=e177] [cursor=pointer]
              - paragraph [ref=e180]:
                - text: The sandbox applies to spawned commands, not just to built-in file operations. If the agent runs tools like
                - code [ref=e181]: git
                - text: ", package managers, or test runners, those commands inherit the same sandbox boundaries."
              - paragraph [ref=e182]: "Codex uses platform-native enforcement on each OS. The implementation differs between macOS, Linux, WSL2, and native Windows, but the idea is the same across surfaces: give the agent a bounded place to work so routine tasks can run autonomously inside clear limits."
              - heading "Why it matters Copy link to why it matters" [level=2] [ref=e183]:
                - generic [ref=e184]: Why it matters
                - button "Copy link to why it matters" [ref=e185] [cursor=pointer]
              - paragraph [ref=e188]: The sandbox reduces approval fatigue. Instead of asking you to confirm every low-risk command, the agent can read files, make edits, and run routine project commands within the boundary you already approved.
              - paragraph [ref=e189]: It also gives you a clearer trust model for agentic work. You aren’t just trusting the agent’s intentions; you are trusting that the agent is operating inside enforced limits. That makes it easier to let the agent work independently while still knowing when it will stop and ask for help.
              - heading "Getting started Copy link to getting started" [level=2] [ref=e190]:
                - generic [ref=e191]: Getting started
                - button "Copy link to getting started" [ref=e192] [cursor=pointer]
              - paragraph [ref=e195]: The default permissions mode applies sandboxing automatically.
              - heading "Prerequisites Copy link to prerequisites" [level=3] [ref=e196]:
                - generic [ref=e197]: Prerequisites
                - button "Copy link to prerequisites" [ref=e198] [cursor=pointer]
