                - button "Copy link to configure defaults" [ref=e378] [cursor=pointer]
              - paragraph [ref=e381]:
                - text: To start with the same behavior every time, set defaults in
                - code [ref=e382]: config.toml
                - text: .
                - link "Config basics" [ref=e383] [cursor=pointer]:
                  - /url: /docs/config-file/config-basic
                - text: explains how it works, and the
                - link "Configuration reference" [ref=e384] [cursor=pointer]:
                  - /url: /docs/config-file/config-reference
                - text: documents the exact keys for
                - code [ref=e385]: sandbox_mode
                - text: ","
                - code [ref=e386]: approval_policy
                - text: ","
                - code [ref=e387]: approvals_reviewer
                - text: ", and"
                - code [ref=e388]: sandbox_workspace_write.writable_roots
                - text: . Use those settings to decide how much autonomy the agent gets by default, which directories it can write to, when it should pause for approval, and who reviews eligible approval requests.
              - paragraph [ref=e389]: "At a high level, the common sandbox modes are:"
              - list [ref=e390]:
                - listitem [ref=e391]:
                  - code [ref=e392]: read-only
                  - text: ": The agent can inspect files, but it can’t edit files or run commands without approval."
                - listitem [ref=e393]:
                  - code [ref=e394]: workspace-write
                  - text: ": The agent can read files, edit within the workspace, and run routine local commands inside that boundary. This is the default low-friction mode for local work."
                - listitem [ref=e395]:
                  - code [ref=e396]: danger-full-access
                  - text: ": The agent runs without sandbox restrictions. This removes the filesystem and network boundaries and should be used only when you want the agent to act with full access."
              - paragraph [ref=e397]: "The common approval policies are:"
              - list [ref=e398]:
                - listitem [ref=e399]:
                  - code [ref=e400]: untrusted
                  - text: ": The agent asks before running commands that aren’t in its trusted set."
                - listitem [ref=e401]:
                  - code [ref=e402]: on-request
                  - text: ": The agent works inside the sandbox by default and asks when it needs to go beyond that boundary."
                - listitem [ref=e403]:
                  - code [ref=e404]: never
                  - text: ": The agent doesn’t stop for approval prompts."
              - paragraph [ref=e405]:
                - text: When approvals are interactive, you can also choose who reviews them with
                - code [ref=e406]: approvals_reviewer
                - text: ":"
              - list [ref=e407]:
                - listitem [ref=e408]:
                  - code [ref=e409]: user
                  - text: ": approval prompts surface to the user. This is the default."
                - listitem [ref=e410]:
                  - code [ref=e411]: auto_review
                  - text: ": eligible approval prompts go to a reviewer agent (see"
                  - link "automatic review" [ref=e412] [cursor=pointer]:
                    - /url: /docs/sandboxing/auto-review
                  - text: ).
              - paragraph [ref=e413]:
                - text: Full access means using
                - code [ref=e414]: sandbox_mode = "danger-full-access"
                - text: together with
                - code [ref=e415]: approval_policy = "never"
                - text: . By contrast, the lower-risk local automation preset is
                - code [ref=e416]: sandbox_mode = "workspace-write"
                - text: together with
                - code [ref=e417]: approval_policy = "on-request"
                - text: ", or the matching CLI flags"
                - code [ref=e418]: "--sandbox workspace-write --ask-for-approval on-request"
                - text: . You can then keep
                - code [ref=e419]: approvals_reviewer = "user"
                - text: for manual approvals or set
                - code [ref=e420]: approvals_reviewer = "auto_review"
                - text: for automatic approval review.
              - paragraph [ref=e421]: If you need the agent to work across more than one directory, writable roots let you extend the places it can modify without removing the sandbox entirely. If you need a broader or narrower trust boundary, adjust the default sandbox mode and approval policy instead of relying on one-off exceptions.
              - paragraph [ref=e422]:
                - text: When a workflow needs a specific exception, use
                - link "rules" [ref=e423] [cursor=pointer]:
                  - /url: /docs/agent-configuration/rules
                - text: . Rules let you allow, prompt, or forbid command prefixes outside the sandbox, which is often a better fit than broadly expanding access. For IDE-specific settings entry points, see
                - link "Codex IDE extension settings" [ref=e424] [cursor=pointer]:
                  - /url: /docs/developer-settings?surface=ide
                - text: .
              - paragraph [ref=e425]:
                - text: Automatic review, when available, doesn’t change the sandbox boundary. It’s one possible
                - code [ref=e426]: approvals_reviewer
                - text: for approval requests at that boundary, such as sandbox escalations, blocked network access, or side-effecting tool calls that still need approval. Actions already allowed inside the sandbox run without extra review. For the reviewer lifecycle, trigger types, denial semantics, and configuration details, see
                - link "automatic review" [ref=e427] [cursor=pointer]:
                  - /url: /docs/sandboxing/auto-review
                - text: .
              - paragraph [ref=e428]:
                - text: Platform details live in the platform-specific docs. For native Windows setup, behavior, and troubleshooting, see
                - link "Windows" [ref=e429] [cursor=pointer]:
                  - /url: /docs/windows/windows-sandbox
                - text: . For admin requirements and organization-level constraints on sandboxing and approvals, see
                - link "Agent approvals & security" [ref=e430] [cursor=pointer]:
                  - /url: /docs/agent-approvals-security
                - text: .
