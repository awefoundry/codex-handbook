            - heading "How permissions work Copy link to how permissions work" [level=2] [ref=e290]:
              - generic [ref=e291]: How permissions work
              - button "Copy link to how permissions work" [ref=e292] [cursor=pointer]
            - generic [ref=e295]:
              - paragraph [ref=e296]: Use the permissions control for your surface to change how Codex handles local actions.
              - paragraph [ref=e297]: Approvals determine when Codex pauses before an action, while the sandbox determines which files and network resources commands can access. When an approval offers different scopes, such as approving once or for the session, choose the narrowest scope that lets the task continue. Keep the project boundary as the default; use separate projects or worktrees instead of broadening access across unrelated repositories.
            - generic [ref=e298]:
