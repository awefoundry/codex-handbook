interface:
  display_name: "公众号文章工作流"
  short_description: "润色文章、统一配图，并按阅读阶段输出标题式历史文章埋点与正文网站入口"
  default_prompt: "请按 gzhwz 工作流处理这篇公众号文章：先完成人性化润色，调用 imagegzh 统一处理每张正文配图并按顺序编号；历史文章只从当前标题目录中选择，用户确认新文章已发布并提供标题或截图后可追加目录；在 opening、contextual、decision、closing 阶段写出准确的《已发表文章标题》，并可在自然语义节点嵌入已核验的网站链接；历史文章不猜 URL、不输出 UTM，网站按事件添加 UTM；为每个入口记录唯一 event_id、意图、位置、目标标题或 URL、绑定/核验状态和发布后指标待记录项；结尾保持相关资源（如有）、网站 CTA、微信 CTA 的顺序；最后验收标题、图片、埋点分布、二维码和待确认项。"
